<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="login" class="container mt-5">
    <h2>Sistema de Biblioteca</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" id="username" class="form-control">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>

  <div id="dashboard" class="d-none">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand">Biblioteca</span>
      </div>
    </nav>

    <div class="d-flex">
      <div class="bg-light border" style="width: 200px;">
        <ul class="nav flex-column p-2">
          <li class="nav-item"><a href="#" id="menuStudents" class="nav-link">Estudiantes</a></li>
          <li class="nav-item"><a href="#" id="menuBooks" class="nav-link">Libros</a></li>
          <li class="nav-item"><a href="#" id="menuLoans" class="nav-link">Préstamos</a></li>
        </ul>
      </div>

      <div id="content" class="p-4 flex-grow-1"></div>
    </div>

    <footer class="bg-dark text-white text-center p-2">
      © 2026 Biblioteca
    </footer>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
